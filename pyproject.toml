[project]
name = "parsing-ria"
version = "0.1.0"
description = "App base depences"
authors = [
    {name = "vipogulyaev",email = "vipogulyaev@yandex.ru"}
]
license = {text = "-"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.136.3,<0.137.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "sqlalchemy (>=2.0.50,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "tenacity (>=9.1.4,<10.0.0)",
    "bs4 (>=0.0.2,<0.0.3)",
    "newspaper3k (>=0.2.8,<0.3.0)",
    "celery (>=5.6.3,<6.0.0)",
    "uvicorn[standard] (>=0.34.0,<0.35.0)",
    "redis (>=5.0,<6.5)",
    "sumy (>=0.12.0,<0.13.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
isort = "^8.0.1"
ruff = "^0.15.15"

